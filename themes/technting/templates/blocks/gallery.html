{% if block['items'] %}<section class="media-block media-wide gallery-block">
{% if block.title %}<h2>{{ block.title }}</h2>{% endif %}
<div class="gallery-grid cols-{{ block.columns or '3' }}">{% for it in block['items'] %}{% set img = media(it.image, '960w') if it.image else none %}{% if img %}
<figure><a href="{{ media(it.image).url }}" target="_blank" rel="noopener"><img src="{{ img.url }}" alt="{{ img.alt or it.caption }}" loading="lazy" decoding="async"></a>{% if it.caption %}<figcaption>{{ it.caption }}</figcaption>{% endif %}</figure>
{% endif %}{% endfor %}</div></section>{% endif %}
