<!doctype html>
<html lang="{{ lang }}" dir="{% if lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>{{ title }} · Technting</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ec;color:#0b1320;font:17px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
.box{max-width:480px;width:100%;background:#fff;border:1px solid #e2ddd1;border-radius:16px;padding:32px 28px;box-shadow:0 18px 50px -24px rgba(11,19,32,.3)}
.mark{font-weight:800;letter-spacing:.02em;color:#017f74;margin:0 0 18px;font-size:15px}
h1{font-size:26px;line-height:1.25;margin:0 0 10px}p{margin:0 0 20px;color:#3b4656}
button,a.btn{display:inline-block;font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;border:0;cursor:pointer;text-decoration:none}
button{background:#0b1320;color:#fff;margin-inline-end:10px}a.btn{background:transparent;color:#017f74;padding-inline:0}
</style></head>
<body><main class="box"><p class="mark" dir="ltr">Technting</p><h1>{{ title }}</h1><p>{{ text }}</p>
{% if form %}<form method="post"><button type="submit">{{ t.unsub_button }}</button><a class="btn" href="{{ site_url }}{% if lang == 'ar' %}/ar/{% endif %}">{{ t.back }}</a></form>
{% else %}<a class="btn" href="{{ site_url }}{% if lang == 'ar' %}/ar/blog/{% else %}/blog/{% endif %}">{{ t.back }} →</a>{% endif %}
</main></body></html>
