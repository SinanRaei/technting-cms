# nginx for the Technting CMS Docker stack.
#   :8080  the published site (static files from the shared "site" volume)
#   :8000  the dashboard: static files from the image, everything else to the app container
# Put your TLS proxy (Caddy, Traefik, a load balancer) in front of both ports for a public server.

map $http_x_forwarded_proto $technting_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

upstream technting_app {
  server app:8000;
}

server {
  listen 8080;
  server_name _;
  root /srv/site;
  index index.html;
  charset utf-8;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Redirects managed in the dashboard (Settings); web-start.sh reloads nginx when the file changes
  include /data/var/redirects*.conf;

  # Contact form, Technting Forms, stats beacon and newsletter go to the dashboard
  location ~ ^/(api|f|newsletter)/ {
    proxy_pass http://technting_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $technting_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    client_max_body_size 25m;
  }

  location /assets/ { expires 7d; }
  location /uploads/ { expires 30d; }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}

server {
  listen 8000;
  server_name _;
  client_max_body_size 100m;   # video uploads (Technting CMS limit 95 MB)

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;

  location /static/ {
    alias /usr/share/technting/static/;
    expires 7d;
  }

  location / {
    proxy_pass http://technting_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $technting_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;
  }
}
