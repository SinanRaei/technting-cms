server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  ssl_certificate_key /etc/nginx/ssl-certificates/cms.example.com.key;
  ssl_certificate /etc/nginx/ssl-certificates/cms.example.com.crt;
  server_name cms.example.com;

  access_log /home/technting/logs/nginx/cms-access.log;
  error_log /home/technting/logs/nginx/cms-error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  client_max_body_size 100m;  # video uploads (Technting CMS limit 95 MB; Cloudflare caps requests at 100 MB)
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /static/ {
    alias /home/technting/technting-cms-var/static/;
    expires 7d;
  }

  location / {
    proxy_pass http://127.0.0.1:18150;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 90s;
  }
}
